<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030407">
<title>SPACE STRIKE — RECOMPENSAS</title>
<link rel="stylesheet" href="../css/shop.css">
<style>
body{margin:0;background:#030407;color:#fff;font-family:system-ui,sans-serif;}
#space{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.main{position:relative;z-index:5;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:20px 14px 48px;}
.page-title{font-size:clamp(26px,6vw,40px);font-weight:900;letter-spacing:5px;text-align:center;
  background:linear-gradient(90deg,#a78bfa,#7b6cff,#c4b5ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.page-subtitle{margin-top:6px;font-size:11px;letter-spacing:3px;color:rgba(180,160,255,0.65);text-align:center;}
.note{width:min(420px,94vw);font-size:12px;color:rgba(200,190,230,0.75);line-height:1.45;margin:14px 0;text-align:center;}
.box{width:min(420px,94vw);display:flex;flex-direction:column;gap:10px;}
.box input,.box select{height:48px;padding:0 14px;border-radius:8px;border:1px solid rgba(140,120,255,0.4);
  background:rgba(12,10,28,0.95);color:#fff;letter-spacing:1px;font-size:14px;}
.box input{text-transform:uppercase;}
.box button,.menu-button{height:48px;border-radius:8px;cursor:pointer;font-weight:800;letter-spacing:1px;font-size:13px;
  border:1px solid rgba(140,120,255,0.45);
  background:linear-gradient(90deg,rgba(80,50,160,0.7),rgba(30,20,60,0.9));color:#d4c4ff;}
#msg,#adminMsg{min-height:22px;text-align:center;font-size:13px;color:#c4b5ff;margin-top:4px;}
.version{position:fixed;left:12px;bottom:10px;font-size:10px;letter-spacing:2px;color:rgba(160,140,220,0.4);}
#transition{position:fixed;inset:0;background:#000;z-index:100;opacity:0;pointer-events:none;transition:opacity .4s;}
#transition.active{opacity:1;pointer-events:all;}
#adminPanel{display:none;width:min(420px,94vw);margin-top:22px;padding:16px;border-radius:12px;
  border:1px solid rgba(255,180,80,0.35);background:rgba(40,28,10,0.55);}
#adminPanel h3{margin:0 0 10px;font-size:13px;letter-spacing:2px;color:#ffd56a;text-align:center;}
#adminPanel label{font-size:11px;color:rgba(255,220,160,0.7);letter-spacing:1px;margin-top:6px;display:block;}
#generatedCode{font-size:15px;font-weight:800;letter-spacing:2px;color:#9fecc8;text-align:center;word-break:break-all;min-height:24px;}
.copyBtn{margin-top:6px;}
</style>
</head>
<body>
<div id="space"></div>
<main class="main">
  <div class="page-title">RECOMPENSAS</div>
  <div class="page-subtitle">CÓDIGOS ESPECIALES // NAVES EXCLUSIVAS</div>
  <p class="note">Ingresa un código de recompensa (uso limitado). Se recomienda iniciar sesión con Google para no perder el desbloqueo.</p>
  <div class="box">
    <input id="codeInput" type="text" placeholder="CÓDIGO" maxlength="40" autocomplete="off">
    <button type="button" id="redeemBtn">CANJEAR</button>
    <div id="msg"></div>
    <p id="invStatusR" style="font-size:11px;color:rgba(180,200,255,0.6);text-align:center;word-break:break-all;"></p>
    <button type="button" class="menu-button" id="irTienda" style="display:none;">IR A TIENDA · NAVES ESPECIALES</button>
  </div>

  <div id="adminPanel">
    <h3>PANEL ADMIN · GENERAR CÓDIGO</h3>
    <label>NAVE ESPECIAL</label>
    <select id="adminShip"></select>
    <label>USOS (1–1000)</label>
    <input id="adminUses" type="number" min="1" max="1000" value="1" style="text-transform:none;">
    <label>PREFIJO (opcional)</label>
    <input id="adminPrefix" type="text" placeholder="ESP" maxlength="12" value="ESP">
    <button type="button" id="createCodeBtn">OBTENER NUEVO CÓDIGO</button>
    <div id="adminMsg"></div>
    <div id="generatedCode"></div>
    <button type="button" class="copyBtn menu-button" id="copyCodeBtn" style="display:none;">COPIAR CÓDIGO</button>
  </div>

  <div class="box" style="margin-top:16px;">
    <button type="button" class="menu-button" id="backButton">&lt; VOLVER</button>
  </div>
  <div class="version">V2.6.14</div>
</main>
<div id="transition"></div>
<script src="../javascript/ships.js"></script>
<script src="../javascript/auth.js"></script>
<script src="../javascript/reward-codes.js"></script>
<script src="../javascript/fullscreen.js"></script>
<script>
(function () {
  var space = document.getElementById("space");
  for (var i = 0; i < 50; i++) {
    var s = document.createElement("div");
    s.style.cssText = "position:absolute;background:#fff;border-radius:50%;width:" + (Math.random()*2+0.4) + "px;height:" + (Math.random()*2+0.4) + "px;left:" + Math.random()*100 + "%;top:" + Math.random()*100 + "%;";
    space.appendChild(s);
  }

  var msg = document.getElementById("msg");
  var adminPanel = document.getElementById("adminPanel");
  var lastCode = "";

  function fillShips() {
    var sel = document.getElementById("adminShip");
    sel.innerHTML = "";
    var list = (window.SpaceStrikeRewards && SpaceStrikeRewards.listSpecialShips()) || [];
    list.forEach(function (s) {
      var opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.name + " (" + s.id + ")";
      sel.appendChild(opt);
    });
  }

  function showAdminIfAllowed() {
    if (window.SpaceStrikeRewards && SpaceStrikeRewards.isAdmin()) {
      adminPanel.style.display = "block";
      fillShips();
    } else {
      adminPanel.style.display = "none";
    }
  }

  function boot() {
    if (window.SpaceStrikeAuth && SpaceStrikeAuth.init) {
      SpaceStrikeAuth.init().then(function () {
        showAdminIfAllowed();
      });
    } else {
      showAdminIfAllowed();
    }
    window.__onSpaceAuthChange = function () {
      showAdminIfAllowed();
    };
    setTimeout(showAdminIfAllowed, 1500);
  }
  boot();

  document.getElementById("redeemBtn").onclick = function () {
    var code = document.getElementById("codeInput").value;
    msg.textContent = "Validando…";
    msg.style.color = "#c4b5ff";
    if (!window.SpaceStrikeRewards) {
      msg.textContent = "Sistema de recompensas no cargó.";
      msg.style.color = "#ff8a8a";
      return;
    }
    SpaceStrikeRewards.redeem(code).then(function (res) {
      if (res && res.ok) {
        msg.textContent = res.message || "¡Recompensa aplicada!";
        msg.style.color = "#9fecc8";
        try {
          var owned = SpaceStrikeShips.loadOwned();
          var eq = SpaceStrikeShips.getEquippedId();
          var ir = document.getElementById("invStatusR");
          if (ir) ir.textContent = "Inventario: " + owned.join(", ") + " | Equipada: " + eq;
          var btn = document.getElementById("irTienda");
          if (btn) { btn.style.display = "block"; btn.onclick = function () { location.href = "shop.html"; }; }
        } catch (e) {}
      } else {
        msg.textContent = (res && res.error) || "Error";
        msg.style.color = "#ff8a8a";
      }
    });
  };

  document.getElementById("createCodeBtn").onclick = function () {
    var am = document.getElementById("adminMsg");
    var gc = document.getElementById("generatedCode");
    var copyBtn = document.getElementById("copyCodeBtn");
    am.textContent = "Creando…";
    am.style.color = "#ffd56a";
    gc.textContent = "";
    copyBtn.style.display = "none";
    if (!SpaceStrikeRewards.isAdmin()) {
      am.textContent = "No autorizado";
      am.style.color = "#ff8a8a";
      return;
    }
    SpaceStrikeRewards.createCode({
      shipId: document.getElementById("adminShip").value,
      uses: document.getElementById("adminUses").value,
      prefix: document.getElementById("adminPrefix").value
    }).then(function (res) {
      if (res && res.ok) {
        lastCode = res.code;
        am.textContent = "Código creado · " + res.uses + " uso(s) · " + res.reward;
        am.style.color = "#9fecc8";
        gc.textContent = res.code;
        copyBtn.style.display = "block";
      } else {
        am.textContent = (res && res.error) || "Error al crear";
        am.style.color = "#ff8a8a";
      }
    });
  };

  document.getElementById("copyCodeBtn").onclick = function () {
    if (!lastCode) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastCode).then(function () {
        document.getElementById("adminMsg").textContent = "Copiado al portapapeles";
      });
    } else {
      prompt("Copia el código:", lastCode);
    }
  };

  document.getElementById("backButton").onclick = function () {
    document.getElementById("transition").classList.add("active");
    setTimeout(function () { location.href = "../index.html"; }, 400);
  };
})();
</script>
</body>
</html>
