<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPACE STRIKE — LOGROS</title>
<link rel="stylesheet" href="../css/leaderboard.css">
<style>
.ach-list{width:min(420px,94vw)}
.ach-item{padding:12px;margin-bottom:8px;border:1px solid rgba(90,170,255,.22);border-radius:8px;background:rgba(8,16,28,.85)}
.ach-item.locked{opacity:.45;filter:grayscale(.4)}
.ach-name{font-weight:800;letter-spacing:2px;color:#7ec8ff}
.ach-desc{font-size:12px;color:rgba(180,205,240,.75);margin-top:4px}
.rank-box{width:min(420px,94vw);margin-bottom:14px;padding:12px;border:1px solid rgba(255,200,80,.3);border-radius:8px;background:rgba(30,20,0,.35)}
</style>
</head>
<body>
<div id="space"></div>
<main class="lb">
<header class="page-header">
<div class="page-title">LOGROS</div>
<div class="page-subtitle">PROGRESIÓN // V2.6.11</div>
</header>
<div class="separator"></div>
<section id="rankBox" class="rank-box"></section>
<section id="achList" class="ach-list"></section>
<section class="actions">
<button id="backButton" class="menu-button" type="button"><span class="button-icon">&lt;</span> VOLVER</button>
</section>
<div class="version">V2.6.11</div>
</main>
<div id="transition"></div>
<script src="../javascript/achievements.js"></script>
<script src="../javascript/rank.js"></script>
<script>
document.getElementById("backButton").onclick=function(){
  var t=document.getElementById("transition");t.classList.add("active");
  setTimeout(function(){location.href="../index.html"},400);
};
(function(){
  var space=document.getElementById("space");
  for(var i=0;i<60;i++){var s=document.createElement("div");s.className="star";
  s.style.cssText="position:absolute;background:#fff;border-radius:50%;width:"+(Math.random()*2+0.4)+"px;height:"+s.style.width+";left:"+Math.random()*100+"%;top:"+Math.random()*100+"%;";space.appendChild(s);}
  var info=window.SpaceStrikeRank?window.SpaceStrikeRank.info():null;
  var rb=document.getElementById("rankBox");
  if(info){rb.innerHTML="<div>RANGO: <strong>"+info.rank.name+"</strong></div><div style='margin-top:6px;font-size:12px;opacity:.75'>XP: "+info.xp+(info.next?" / "+info.next.xp+" → "+info.next.name:" (máx)")+"</div>";}
  var list=window.SpaceStrikeAchievements.list();
  var el=document.getElementById("achList");
  el.innerHTML=list.map(function(a){
    return '<div class="ach-item '+(a.unlocked?"":"locked")+'"><div class="ach-name">'+(a.unlocked?"✦ ":"🔒 ")+a.name+'</div><div class="ach-desc">'+a.desc+"</div></div>";
  }).join("");
})();
</script>
    <script src="../javascript/fullscreen.js"></script>
</body>
</html>
